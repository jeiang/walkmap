<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>walkmap</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="map"></div>

    <div id="toast" class="toast" hidden></div>

    <div id="route-banner" class="route-banner" hidden>
      <span id="route-summary"></span>
      <button id="route-close" aria-label="Close route">&times;</button>
    </div>

    <div id="sheet" class="sheet">
      <div class="sheet-row">
        <input id="search" type="search" placeholder="Search by name (e.g. mini mart)" autocomplete="off" />
      </div>

      <div id="categories" class="chips"></div>

      <div class="sheet-row controls">
        <div class="minutes" id="minutes">
          <span class="controls-label">minutes</span>
          <button data-minutes="10">10</button>
          <button data-minutes="20" class="active">20</button>
          <button data-minutes="30">30</button>
          <button data-minutes="60">60</button>
        </div>
      </div>

      <div class="sheet-row controls">
        <label for="confidence" class="controls-label"
          >min confidence <span id="confidence-value">0.5</span></label
        >
        <input id="confidence" type="range" min="0.3" max="0.9" step="0.05" value="0.5" />
      </div>

      <ul id="results" class="results"></ul>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
